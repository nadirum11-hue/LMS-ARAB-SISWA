<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b6b4b">
  <title>Portal Belajar Bahasa Arab</title>
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <link rel="manifest" href="./manifest.json">
  <style>
    :root{color-scheme:light;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    *{box-sizing:border-box}
    body{margin:0;background:#f3f7f4;color:#18352b}
    header{display:flex;align-items:center;gap:14px;padding:14px clamp(16px,4vw,40px);background:#07583f;color:#fff;box-shadow:0 3px 16px #082f241c}
    header img{width:48px;height:48px;flex:none}
    h1{font-size:clamp(1rem,2.4vw,1.35rem);margin:0}
    header p{margin:3px 0 0;font-size:.85rem;color:#d7f2e5}
    main{max-width:1200px;margin:24px auto;padding:0 16px}
    .notice{padding:14px 16px;border:1px solid #cde5d8;border-radius:14px;background:#fff;margin-bottom:16px;line-height:1.5}
    .actions{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
    a.button{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;border-radius:10px;padding:11px 16px;font-weight:650;background:#08764f;color:white}
    a.secondary{background:#e2f2e9;color:#07583f}
    .app-frame{width:100%;height:calc(100vh - 190px);min-height:540px;border:1px solid #d7e4dc;border-radius:14px;background:white}
    footer{text-align:center;color:#567166;font-size:.8rem;padding:16px}
  </style>
</head>
<body>
  <header>
    <img src="./icon.svg" alt="Ikon Portal Belajar Bahasa Arab">
    <div><h1>Portal Belajar Bahasa Arab</h1><p>Media pembelajaran untuk guru dan siswa</p></div>
  </header>
  <main>
    <div class="notice">Aplikasi dijalankan melalui Google Apps Script. Jika aplikasi tidak tampil di dalam bingkai, gunakan tombol <b>Buka aplikasi langsung</b>.</div>
    <div class="actions">
      <a class="button" href="https://script.google.com/macros/s/AKfycbyDW-T6Ou7Uzww4EnjuBLEIlDJ8zsQIyCSuf84bXfr6shIihqWsAxkMfqHxiGCGfLzj/exec" target="_blank" rel="noopener">Buka aplikasi langsung</a>
      <a class="button secondary" href="./icon.svg" target="_blank" rel="noopener">Lihat ikon aplikasi</a>
    </div>
    <iframe class="app-frame" title="Aplikasi Belajar Bahasa Arab" src="https://script.google.com/macros/s/AKfycbyDW-T6Ou7Uzww4EnjuBLEIlDJ8zsQIyCSuf84bXfr6shIihqWsAxkMfqHxiGCGfLzj/exec" loading="eager" allow="fullscreen"></iframe>
  </main>
  <footer>Portal Belajar Bahasa Arab</footer>
</body>
</html>
